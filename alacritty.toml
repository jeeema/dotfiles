[terminal]
shell = { program = "/Windows/System32/wsl.exe", args = ["~", "-d", "Ubuntu-24.04"] }

[general]
import = [
    "/Users/$FIVE_LETTER_USER_NAME/AppData/Roaming/alacritty/themes/themes/ayu_dark.toml"
]

[window]
padding = { x = 8, y = 2 }
dynamic_padding = false
opacity = 1.0
startup_mode = "Maximized"

[font]
normal = { family = "Moralerspace Neon" }
size = 12

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 500
blink_timeout = 60

[keyboard]
bindings = [
# This conflicts the SIGINT shortcut
#    { key = "C",  mods = "Control", action = "Copy" },
    { key = "V",  mods = "Control", action = "Paste" },
    { key = "N",  mods = "Control", action = "CreateNewWindow" },
 ]
