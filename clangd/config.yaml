Index:
  # Enable project index generation in background (faster jump to definitions)
  Background: 'Build'

CompileFlags:
  Add:
    - '-Wall'
    - '-Wextra'
    - '-pedantic-errors'
    - '-Wshadow'
    - '-Wfloat-conversion'
    - '-Wsign-conversion'
    - '-Wfloat-equal'
    - '-Wold-style-cast'
    - '-Wnon-virtual-dtor'
    - '-Woverloaded-virtual'
    - '-Wno-empty-translation-unit'
    - '-Wdocumentation'
  Remove:
    # Intel compiler flags
    - '-xHost'
    - '-qopenmp'
    - '-fiopenmp'
    - '-ipo'
    - '-qpot-report'
    - '-fp-model=*'
    # CUDA compiler flags
    - '--expt-extended-lambda'
    - '--expt-relaxed-constexpr'
    - "-forward-unknown-to-host-compiler"
    - '-ccbin*'
    - '-G'
    - '-gencode*'
    - '-Xcompiler*'

Diagnostics:
  UnusedIncludes: Strict
  MissingIncludes: Info

  ClangTidy:
    Add:
      - bugprone-*
      - llvm-header-guard
      - misc-*
      - modernize-*
      - mpi-*
      - openmp-*
      - performance-*
    Remove:
      - bugprone-easily-swappable-parameters
      - misc-misplaced-const
    CheckOptions:
      readability-inconsistent-declaration-parameter-name.Strict: true
      modernize-use-nullptr.NullMacros: 'NULL'

Completion:
  AllScopes: Yes
